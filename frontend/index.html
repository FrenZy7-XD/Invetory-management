                  type="number"
                  placeholder="5"
                  value={minThreshold}
                  onChange={e => setMinThreshold(e.target.value)}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>

              <div className="sm:col-span-2">
                <label className="block text-xs font-medium text-slate-700 mb-1">
                  Barcode {isPackaged ? <span className="text-rose-600 font-semibold">* (Mandatory)</span> : '(Optional)'}
                </label>
                <input
                  type="text"
                  placeholder={isPackaged ? "Barcode required *" : "e.g. 8901030..."}
                  value={barcode}
                  onChange={e => setBarcode(e.target.value)}
                  required={isPackaged}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs text-slate-800 font-mono focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>

              <div className="sm:col-span-2 flex items-center gap-4 bg-slate-50 px-3 h-11 rounded-xl border border-slate-200 text-xs">
                <label className="flex items-center gap-1.5 cursor-pointer text-slate-700 font-medium">
                  <input
                    type="checkbox"
                    checked={isPackaged}
                    onChange={e => setIsPackaged(e.target.checked)}
                    className="rounded border-slate-300 text-indigo-500 focus:ring-0"
                  />
                  <span>Packaged</span>
                </label>

                <label className="flex items-center gap-1.5 cursor-pointer text-slate-700 font-medium">
                  <input
                    type="checkbox"
                    checked={isPerishable}
                    onChange={e => setIsPerishable(e.target.checked)}
                    className="rounded border-slate-300 text-indigo-500 focus:ring-0"
                  />
                  <span>Perishable</span>
                </label>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-700 mb-1">Initial Qty</label>
                <input
                  type="number"
                  placeholder="20"
                  value={initialQty}
                  onChange={e => setInitialQty(e.target.value)}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-700 mb-1">Batch ID</label>
                <input
                  type="text"
                  placeholder="LOT-101"
                  value={batchId}
                  onChange={e => setBatchId(e.target.value)}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs text-slate-800 font-mono focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>

              {isPerishable && (
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-700 mb-1">Expiry Date *</label>
                  <input
                    type="date"
                    required={isPerishable && Boolean(initialQty && Number(initialQty) > 0)}
                    value={expirationDate}
                    onChange={e => setExpirationDate(e.target.value)}
                    className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                  />
                </div>
              )}

              <div className="flex items-end sm:col-span-2">
                <button
                  type="submit"
                  className="w-full h-11 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 ease-in-out"
                >
                  Save Product
                </button>
              </div>
            </form>
          </div>

          {/* Desktop Data Table / Mobile Cards with Semantic Badges */}
          <div className="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
            <div className="p-4 sm:p-5 border-b border-slate-200/80 flex justify-between items-center bg-white">
              <div>
                <h3 className="text-sm font-semibold tracking-tight text-slate-800">Inventory Catalog</h3>
                <p className="text-xs text-slate-500">Live batches, stock health, and FEFO allocation status.</p>
              </div>
              <button
                onClick={fetchInventory}
                className="flex items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 transition-colors"
              >
                <Icons.Refresh className="w-3.5 h-3.5 text-slate-400" />
                <span>Refresh</span>
              </button>
            </div>

            {loading ? (
              <div className="p-12 text-center text-xs text-slate-400">Loading catalog...</div>
            ) : safeItems.length === 0 ? (
              <div className="p-12 text-center text-xs text-slate-400">No inventory products found. Register one above.</div>
            ) : (
              <>
                {/* Desktop Airy Table View with Semantic Color Highlights */}
                <div className="hidden lg:block overflow-x-auto">
                  <table className="min-w-full divide-y divide-slate-100 text-left text-xs">
                    <thead className="bg-slate-50/80 text-slate-500 font-medium uppercase tracking-wider">
                      <tr>
                        <th className="px-5 py-3.5">Product</th>
                        <th className="px-5 py-3.5">Barcode</th>
                        <th className="px-5 py-3.5">Price</th>
                        <th className="px-5 py-3.5">Total Stock</th>
                        <th className="px-5 py-3.5">Active Batches (FEFO)</th>
                        <th className="px-5 py-3.5 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 bg-white">
                      {safeItems.map(item => {
                        const batches = Array.isArray(item?.batches) ? item.batches : [];
                        const activeBatches = batches.filter(b => b && b.quantity > 0);
                        const totalStock = item?.totalStock || 0;
                        const isOutOfStock = totalStock === 0;

                        return (
                          <tr key={item.id} className="hover:bg-slate-50/70 transition-colors">
                            <td className="px-5 py-4 font-semibold text-slate-800">
                              <div className="flex items-center gap-2">
                                <span>{item.name}</span>
                                {item.isPackaged && (
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-50 text-indigo-600 border border-indigo-100">
                                    Packaged
                                  </span>
                                )}
                                {item.isPerishable && (
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200">
                                    Perishable
                                  </span>
                                )}
                              </div>
                            </td>
                            <td className="px-5 py-4 font-mono text-slate-500">
                              {item.barcode || <span className="text-slate-400 italic">None</span>}
                            </td>
                            <td className="px-5 py-4 font-semibold text-slate-800 font-mono">
                              ${Number(item.price || 0).toFixed(2)}
                            </td>
                            <td className="px-5 py-4">
                              <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${
                                isOutOfStock 
                                  ? 'bg-rose-50 text-rose-600 border border-rose-200' 
                                  : item.isLowStock 
                                    ? 'bg-amber-50 text-amber-600 border border-amber-200' 
                                    : 'bg-emerald-50 text-emerald-600 border border-emerald-200'
                              }`}>
                                <span className="h-1.5 w-1.5 rounded-full bg-current"></span>
                                <span>{totalStock} units</span>
                              </span>
                            </td>
                            <td className="px-5 py-4">
                              {activeBatches.length === 0 ? (
                                <span className="text-slate-400 italic">0 batches active</span>
                              ) : (
                                <div className="flex flex-wrap gap-1.5">
                                  {activeBatches.map((batch, bIdx) => {
                                    const expiry = batch.expirationDate ? new Date(batch.expirationDate) : null;
                                    return (
                                      <span
                                        key={batch.id}
                                        className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-mono border ${
                                          bIdx === 0 
                                            ? 'bg-indigo-50 border-indigo-100 text-indigo-700 font-semibold' 
                                            : 'bg-slate-50 border-slate-200 text-slate-600'
                                        }`}
                                      >
                                        <span>{batch.batchId}:</span>
                                        <strong>{batch.quantity}u</strong>
                                        {expiry && <span className="text-slate-400">({expiry.getMonth()+1}/{expiry.getDate()})</span>}
                                      </span>
                                    );
                                  })}
                                </div>
                              )}
                            </td>
                            <td className="px-5 py-4 text-right">
                              <div className="flex items-center justify-end gap-2">
                                <button
                                  onClick={() => setBatchModalItem(item)}
                                  className="h-8 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs font-medium border border-indigo-100 transition-colors"
                                >
                                  + Batch
                                </button>
                                <button
                                  onClick={() => handleDeleteItem(item.id, item.name)}
                                  className="text-slate-400 hover:text-rose-600 p-1.5 transition-colors"
                                  title="Delete product"
                                >
                                  <Icons.Trash className="w-4 h-4" />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* Mobile Cards with Semantic Highlighting */}
                <div className="lg:hidden divide-y divide-slate-100">
                  {safeItems.map(item => {
                    const batches = Array.isArray(item?.batches) ? item.batches : [];
                    const activeBatches = batches.filter(b => b && b.quantity > 0);
                    const totalStock = item?.totalStock || 0;
                    const isOutOfStock = totalStock === 0;

                    return (
                      <div key={item.id} className="p-4 space-y-3 hover:bg-slate-50/50 transition-colors">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2">
                              <h4 className="text-sm font-semibold text-slate-800">{item.name}</h4>
                              {item.isPackaged && (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-50 text-indigo-600 border border-indigo-100">
                                  Packaged
                                </span>
                              )}
                            </div>
                            <div className="text-xs text-slate-500 mt-0.5 flex items-center gap-2">
                              <span className="font-semibold text-slate-800">${Number(item.price || 0).toFixed(2)}</span>
                              <span>•</span>
                              <span className="font-mono">{item.barcode || 'No barcode'}</span>
                            </div>
                          </div>

                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${
                            isOutOfStock 
                              ? 'bg-rose-50 text-rose-600 border border-rose-200' 
                              : item.isLowStock 
                                ? 'bg-amber-50 text-amber-600 border border-amber-200' 
                                : 'bg-emerald-50 text-emerald-600 border border-emerald-200'
                          }`}>
                            <span className="h-1.5 w-1.5 rounded-full bg-current"></span>
                            <span>{totalStock} units</span>
                          </span>
                        </div>

                        {/* Batches Pill */}
                        <div className="pt-2 border-t border-slate-100 flex flex-wrap gap-1.5">
                          {activeBatches.length === 0 ? (
                            <span className="text-xs text-slate-400 italic">0 batches active</span>
                          ) : (
                            activeBatches.map((batch, bIdx) => (
                              <span
                                key={batch.id}
                                className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-mono border ${
                                  bIdx === 0 ? 'bg-indigo-50 border-indigo-100 text-indigo-700 font-semibold' : 'bg-slate-50 border-slate-200 text-slate-600'
                                }`}
                              >
                                <span>{batch.batchId}: {batch.quantity}u</span>
                              </span>
                            ))
                          )}
                        </div>

                        <div className="flex justify-between items-center pt-2">
                          <button
                            onClick={() => setBatchModalItem(item)}
                            className="h-9 px-3.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-100 rounded-xl text-xs font-medium transition-colors"
                          >
                            + Add Batch
                          </button>
                          <button
                            onClick={() => handleDeleteItem(item.id, item.name)}
                            className="text-slate-400 hover:text-rose-600 p-2"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          {/* Add Batch Modal */}
          {batchModalItem && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full shadow-lg animate-in fade-in zoom-in-95">
                <h4 className="text-sm font-semibold tracking-tight text-slate-800 mb-1">Add Batch Stock</h4>
                <p className="text-xs text-slate-500 mb-4">Product: <strong className="text-slate-800">{batchModalItem.name}</strong></p>

                <form onSubmit={handleAddBatch} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">Batch ID</label>
                    <input
                      type="text"
                      placeholder="LOT-2026-X"
                      value={newBatchId}
                      onChange={e => setNewBatchId(e.target.value)}
                      className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 font-mono focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">Quantity *</label>
                    <input
                      type="number"
                      required
                      placeholder="20"
                      value={newBatchQty}
                      onChange={e => setNewBatchQty(e.target.value)}
                      className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">
                      Expiration Date {batchModalItem.isPerishable ? <span className="text-rose-600 font-semibold">* (Mandatory)</span> : '(Optional)'}
                    </label>
                    <input
                      type="date"
                      required={batchModalItem.isPerishable}
                      value={newBatchExpiry}
                      onChange={e => setNewBatchExpiry(e.target.value)}
                      className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setBatchModalItem(null)}
                      className="h-11 px-4 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="h-11 px-5 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-xl text-xs shadow-sm transition-all duration-200 ease-in-out"
                    >
                      Save Batch
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. AUTHENTICATION VIEW (Soft Warm SaaS Login/Signup)
    // =========================================================================
    function Auth({ onLoginSuccess }) {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        const endpoint = isLogin ? '/api/auth/login' : '/api/auth/signup';
        const payload = isLogin ? { email, password } : { email, password, name };

        try {
          const res = await fetch(`${API_URL}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            onLoginSuccess(data.token, data.vendor);
          } else {
            setError(data.error || 'Authentication failed');
          }
        } catch (err) {
          setError('Cannot connect to backend server at ' + API_URL);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50 text-slate-800 font-sans">
          <div className="bg-white border border-slate-200/80 p-8 sm:p-10 rounded-2xl w-full max-w-md shadow-sm space-y-6">
            <div className="text-center space-y-2">
              <div className="inline-flex h-12 w-12 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-2xl items-center justify-center shadow-xs">
                <Icons.Box className="w-6 h-6 text-indigo-600" />
              </div>
              <h1 className="text-xl font-bold tracking-tight text-slate-800">Nexus Stock</h1>
              <p className="text-xs text-slate-500">Modern Multi-Tenant Inventory & Rapid Outgoing</p>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-200 text-rose-600 text-xs p-3.5 rounded-xl flex items-center gap-2">
                <Icons.AlertOctagon className="w-4 h-4 shrink-0 text-rose-500" />
                <span>{error}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">Company / Trader Name</label>
                  <input
                    type="text"
                    required
                    placeholder="Apex Wholesale Corp"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                  />
                </div>
              )}
              <div>
                <label className="block text-xs font-medium text-slate-700 mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="admin@company.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-700 mb-1">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3.5 text-xs text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all duration-200 ease-in-out"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full h-11 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-xl transition-all duration-200 ease-in-out shadow-sm hover:shadow-md hover:-translate-y-0.5 disabled:opacity-50 text-xs mt-2"
              >
                {loading ? 'Please wait...' : (isLogin ? 'Sign in to workspace' : 'Create new account')}
              </button>
            </form>

            <div className="pt-4 text-center text-xs text-slate-500 border-t border-slate-100">
              {isLogin ? "Don't have an account? " : "Already have an account? "}
              <button
                onClick={() => { setIsLogin(!isLogin); setError(''); }}
                className="text-indigo-600 hover:text-indigo-700 font-semibold underline ml-1"
              >
                {isLogin ? 'Register' : 'Sign In'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } catch (renderError) {
      console.error('Fatal render error:', renderError);
      document.getElementById('root').innerHTML = '<div class="p-8 text-rose-600 text-sm">Initialization error: ' + renderError.message + '</div>';
    }
  </script>
</body>
</html>
